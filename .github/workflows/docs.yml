name: Deploy docs

on:
  push:
    branches: [main]

permissions:
  contents: write  # gh-deploy force-pushes the built site to the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      # No path filter: mkdocstrings pulls API docs from h2ml/**/*.py docstrings,
      # so a docs change can come from a source edit, not just docs/**.
      - name: Build and deploy
        run: uv run mkdocs gh-deploy --force --strict
