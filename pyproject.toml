[project]
name = "h2ml"
version = "0.1.0"
description = "4-step AutoML pipeline for tabular data: model screening, SHAP feature selection, and Optuna HPO"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Hugo Parra", email = "h2ugo.parra@pm.me" }
]
keywords = ["automl", "machine-learning", "tabular", "optuna", "shap", "scikit-learn", "feature-selection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "h2mare>=0.1.1",
    "joblib>=1.5.3",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "numpy>=2.0.0",
    "optuna>=4.7.0",
    "pandas>=3.0.1",
    "polars>=1.38.1",
    "pyarrow>=23.0.1",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.11.0",
    "tox>=4.30.0",
    "tox-uv>=1.28.0",
]


[project.urls]
Repository = "https://github.com/h2ugoparra/h2ml"
Documentation = "https://h2ugoparra.github.io/h2ml"
"Bug Tracker" = "https://github.com/h2ugoparra/h2ml/issues"

[project.optional-dependencies]
boosting = [
    "catboost>=1.2.10",
    "lightgbm>=4.6.0",
    "xgboost>=3.2.0",
]
geo = [
    "h2mare>=0.1.1",
    "cartopy>=0.25.0",
    "polars>=1.38.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.tox]
legacy_tox_ini = """
[tox]
env_list = py311, py312, py313
isolated_build = true

[testenv]
runner = uv-venv-lock-runner
extras = boosting
commands =
    pytest tests/ -q
"""

[tool.pytest.ini_options]
pythonpath = ["h2ml"]

[tool.coverage.run]
source = ["h2ml"]
omit = ["h2ml/geo/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E221", "E251", "E302", "E303", "E203", "E272"]

