site_name: h2ml
site_description: 4-step AutoML pipeline for tabular data
site_author: Hugo Parra
repo_url: https://github.com/h2ugoparra/h2ml
repo_name: h2ugoparra/h2ml

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Pipeline:
    - Overview: pipeline.md
    - Spatial CV: spatial_cv.md
  - Guides:
    - Exploratory Data Analysis: guides/eda.md
    - Y-Transforms: guides/transforms.md
    - Conformal Prediction: guides/conformal.md
    - Geo Prediction: guides/geo_predict.md
    - Comparing Runs: guides/comparison.md
    - Visualization: guides/visualization.md
    - Persistence: guides/persistence.md
  - API Reference:
    - Pipeline: api/pipeline.md
    - EDA: api/eda.md
    - PipelineData: api/feature_store.md
    - Spatial CV: api/spatial_cv.md
    - Metrics: api/metrics.md
    - Optimizer: api/optimizer.md
    - FinalModel: api/final_model.md
